name = "k-tracker"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "k-tracker"
database_id = "c320602d-2e2b-43de-a5b3-baaf9fb43a49"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "GPX"
bucket_name = "k-tracker-gpx"

[vars]
SITE_URL = "https://k-tracker-vit.pages.dev"
# Monetization slots stay hidden until these are set (Pages dashboard → Settings → Variables)
ADSENSE_CLIENT = ""
AGODA_CID = ""
# Street photos: Kakao Maps JS key (Korea roadview) / Google Maps Embed key (overseas). Tab falls back to links when empty.
KAKAO_JS_KEY = "5af3ab529a2880667bb6c56bc04d4ad1"
GOOGLE_MAPS_KEY = ""
