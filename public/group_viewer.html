<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-TRACKER | 그룹 뷰어</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      padding: 2rem;
      background-color: #f2f2f2;
    }
    .runner-box {
      background: white;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      transition: background-color 0.3s;
      position: relative;
    }
    .runner-box:hover {
      background-color: #f8f9fa;
    }
    .runner-box h5 {
      margin-bottom: 0.5rem;
    }
    .runner-box a {
      color: inherit;
      text-decoration: none;
      display: block;
    }
    .runner-meta {
      font-size: 0.9rem;
      color: #555;
    }
    .remove-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: transparent;
      border: none;
      color: #dc3545;
      font-size: 1.2rem;
      cursor: pointer;
    }
    footer a:hover {
    color: #ffc107 !important; /* 노란색 hover 효과 */
    text-decoration: none;
    }
    #countdown {
      color: #dc3545;
      font-weight: bold;
      margin-left: 5px;
    }
    .loading {
      display: inline-block;
      margin-left: 5px;
    }
  </style>
  <!-- FontAwesome 아이콘 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="container">
  <h1 class="mb-4 text-center">📊 그룹 러너 정보</h1>

  <div id="eventInfo" class="alert alert-info" role="alert">
    대회 정보를 불러오는 중입니다...
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <strong>그룹명:</strong> <span id="groupNameText">-</span>
    </div>
    <div>
      <button class="btn btn-sm btn-outline-primary me-2" onclick="renameGroup()">✏️ 그룹 이름 수정</button>
      <button class="btn btn-sm btn-outline-secondary me-2" onclick="copyShareLink()">🔗 공유 링크 복사</button>
      <button id="refreshButton" class="btn btn-sm btn-outline-success" onclick="manualRefresh()">
        🔄 수동 새로고침 <span id="countdown"></span>
      </button>
    </div>
  </div>

<!-- 🔽 수동/자동 새로고침 안내 영역 추가 -->
<div class="text-center mb-4" style="font-size: 0.9rem; color: #777;">
  ⏱ 5분마다 자동 새로고침됩니다<br>
  <span id="lastRefreshTime">최근 새로고침: -</span>
</div>

  <div class="mb-4">
    <label for="bibInput" class="form-label">🎽 배번호로 선수 등록</label>
    <div class="input-group">
      <input type="text" class="form-control" id="bibInput" placeholder="예: 1234" />
      <button class="btn btn-primary" id="addRunnerBtn">추가</button>
    </div>
    <div id="addStatus" class="mt-2"></div>
  </div>

  <div id="runnerList"></div>

  <div class="text-center mt-4">
    <a id="backToGroup" class="btn btn-outline-secondary">⬅️ 그룹 선택으로 돌아가기</a>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const eventId = urlParams.get("eventId");
  const groupId = urlParams.get("group");
  const source = urlParams.get("source") || "myresult";
  const groupKey = `group_${source}_${eventId}_${groupId}`;

  let lastManualRefreshTime = 0;
  let manualButton = null;
  let countdownElement = null;
  let autoRefreshTimer = null;
  let countdownTimer = null;
  let countdownSeconds = 0;

  window.onload = function() {
    document.getElementById("groupNameText").textContent = groupId || "-";
    document.getElementById("backToGroup").href =
      `group_register.html?eventId=${encodeURIComponent(eventId)}&source=${encodeURIComponent(source)}`;

    manualButton = document.getElementById("refreshButton");
    countdownElement = document.getElementById("countdown");

    document.getElementById("addRunnerBtn").addEventListener("click", addRunner);
    document.getElementById("bibInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") addRunner();
    });

    importBibsFromUrl();
    syncShareUrl();
    loadEventInfo();
    loadRunners();
    updateLastRefreshTime();
    startAutoRefresh();
  };

  function startAutoRefresh() {
    if (autoRefreshTimer) clearInterval(autoRefreshTimer);
    autoRefreshTimer = setInterval(() => {
      loadRunners();
      updateLastRefreshTime();
    }, 300000);
  }

  function updateLastRefreshTime() {
    const now = new Date();
    document.getElementById("lastRefreshTime").textContent = `최근 새로고침: ${now.toLocaleTimeString()}`;
  }

  function startCountdown(seconds) {
    if (countdownTimer) clearInterval(countdownTimer);
    countdownSeconds = seconds;
    updateCountdownDisplay();

    countdownTimer = setInterval(() => {
      countdownSeconds--;
      updateCountdownDisplay();
      if (countdownSeconds <= 0) {
        clearInterval(countdownTimer);
        manualButton.disabled = false;
        manualButton.innerHTML = "🔄 수동 새로고침 <span id='countdown'></span>";
        countdownElement = document.getElementById("countdown");
      }
    }, 1000);
  }

  function updateCountdownDisplay() {
    if (!countdownElement) countdownElement = document.getElementById("countdown");
    if (!countdownElement) return;
    countdownElement.textContent = countdownSeconds > 0 ? `(${countdownSeconds}초)` : "";
  }

  function manualRefresh() {
    const now = Date.now();
    if (now - lastManualRefreshTime < 60000) {
      alert("⏳ 수동 새로고침은 1분에 1번만 가능합니다.");
      return;
    }
    lastManualRefreshTime = now;
    loadRunners();
    updateLastRefreshTime();
    startAutoRefresh();

    manualButton = document.getElementById("refreshButton");
    countdownElement = document.getElementById("countdown");
    if (manualButton) {
      manualButton.disabled = true;
      manualButton.innerHTML = "🔄 새로고침 대기 중 <span id='countdown'></span>";
      countdownElement = document.getElementById("countdown");
    }
    startCountdown(60);
  }

  function renameGroup() {
    const newName = prompt("새 그룹 이름을 입력하세요:", groupId);
    if (!newName || newName === groupId) return;

    const oldKey = groupKey;
    const newKey = `group_${source}_${eventId}_${newName}`;
    const data = localStorage.getItem(oldKey);
    if (data) {
      localStorage.setItem(newKey, data);
      localStorage.removeItem(oldKey);
      alert("그룹 이름이 변경되었습니다.");
      location.href = `group_viewer.html?eventId=${encodeURIComponent(eventId)}&group=${encodeURIComponent(newName)}&source=${encodeURIComponent(source)}`;
    }
  }

  // Group members live in this browser's localStorage, so the share link carries the bibs too.
  function currentBibs() {
    return JSON.parse(localStorage.getItem(groupKey) || "[]").map((r) => r.bib);
  }

  function shareUrl() {
    const u = new URL(window.location.href);
    const bibs = currentBibs();
    if (bibs.length) u.searchParams.set("bibs", bibs.join(","));
    else u.searchParams.delete("bibs");
    return u.toString();
  }

  function syncShareUrl() {
    history.replaceState(null, "", shareUrl());
  }

  function importBibsFromUrl() {
    const raw = urlParams.get("bibs") || "";
    const incoming = raw.split(",").map((b) => b.trim()).filter((b) => /^[0-9A-Za-z-]{1,10}$/.test(b)).slice(0, 50);
    if (!incoming.length) return;
    const runners = JSON.parse(localStorage.getItem(groupKey) || "[]");
    for (const bib of incoming) {
      if (!runners.find((r) => r.bib === bib)) runners.push({ bib, name: "", records: [] });
    }
    localStorage.setItem(groupKey, JSON.stringify(runners));
  }

  function copyShareLink() {
    navigator.clipboard.writeText(shareUrl())
      .then(() => alert("공유 링크가 복사되었습니다."))
      .catch(() => alert("복사 실패. 수동으로 복사해주세요."));
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }

  async function loadMyResultRaces() {
    try {
      return await fetchJson("/api/live/races?provider=myresult");
    } catch (_) {
      return await fetchJson("./data/myresult_races_parsed.json");
    }
  }

  async function loadSmartChipRaces() {
    try {
      return await fetchJson("/api/live/races?provider=spct");
    } catch (_) {
      return await fetchJson("https://raw.githubusercontent.com/hakyong-tae/spct-proxy/main/spct_races_parsed.json");
    }
  }

  async function loadEventInfo() {
    const eventInfoElement = document.getElementById("eventInfo");
    eventInfoElement.innerHTML = "대회 정보를 불러오는 중입니다...";

    try {
      if (source === "smartchip") {
        const events = await loadSmartChipRaces();
        const event = events.find((e) => String(e.event_no || e.id) === String(eventId));
        if (event) {
          eventInfoElement.innerHTML = `<strong>${event.title || event.name}</strong><br>${event.date || ""} | SPCT`;
        } else {
          eventInfoElement.innerHTML = "❌ 대회 정보를 찾을 수 없습니다.";
        }
      } else {
        const events = await loadMyResultRaces();
        const event = events.find((e) => String(e.id) === String(eventId));
        if (event) {
          const dateTime = event.date || event.dateTime || "";
          const location = event.location || "장소 정보 없음";
          eventInfoElement.innerHTML = `<strong>${event.name}</strong><br>${dateTime} | ${location}`;
        } else {
          eventInfoElement.innerHTML = "❌ 대회 정보를 찾을 수 없습니다.";
        }
      }
    } catch (e) {
      console.error("대회 정보 불러오기 에러:", e);
      eventInfoElement.textContent = "❌ 대회 정보를 불러오지 못했습니다.";
    }
  }

  function escapeHtml(v) {
    return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }

  function buildResultUrl(bib) {
    if (source === "smartchip") {
      const year = /^20\d{2}/.test(eventId) ? eventId.slice(0, 4) : new Date().getFullYear();
      return `https://time.spct.kr/m2.php?EVENT_NO=${encodeURIComponent(eventId)}&TargetYear=${year}&currentPage=1&BIB_NO=${encodeURIComponent(bib)}`;
    }
    return `https://myresult.co.kr/${encodeURIComponent(eventId)}/${encodeURIComponent(bib)}`;
  }

  // "smartchip" in old links means SPCT (time.spct.kr). MyResult is read from its public runner page.
  // linkOnly cards remain as a fallback when a provider cannot be read.
  async function fetchRunnerData(bib) {
    const provider = source === "smartchip" ? "spct" : "myresult";
    const res = await fetch(`/api/live/record?provider=${provider}&event=${encodeURIComponent(eventId)}&bib=${encodeURIComponent(bib)}`);
    const data = await res.json().catch(() => ({}));
    if (res.status === 501 && data.error === "unsupported") {
      return { bib, name: "", records: [], linkOnly: true };
    }
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    return {
      bib,
      name: (data.name || "").trim(),
      status: data.status || "",
      category: data.category || "",
      total: data.total || "",
      rank: data.rankOverall || "",
      records: data.records || []
    };
  }

  async function addRunner() {
    const bibInput = document.getElementById("bibInput");
    const bib = bibInput.value.trim();
    const addStatus = document.getElementById("addStatus");

    if (!bib) {
      addStatus.innerHTML = "<span class='text-danger'>배번호를 입력해주세요.</span>";
      return;
    }

    addStatus.innerHTML = "<span class='text-info'>선수 정보를 불러오는 중... <i class='fas fa-spinner fa-spin loading'></i></span>";

    try {
      const runner = await fetchRunnerData(bib);
      const runners = JSON.parse(localStorage.getItem(groupKey) || "[]");
      if (!runners.find((r) => r.bib === bib)) {
        runners.push(runner);
        localStorage.setItem(groupKey, JSON.stringify(runners));
        syncShareUrl();
        bibInput.value = "";
        await loadRunners();
        updateLastRefreshTime();
        addStatus.innerHTML = runner.linkOnly
          ? `<span class='text-success'>배번 ${escapeHtml(bib)}이(가) 추가되었습니다. 기록은 MyResult 공식 페이지에서 볼 수 있어요.</span>`
          : `<span class='text-success'>${escapeHtml(runner.name || "배번 " + bib)} (배번호 ${escapeHtml(bib)}) 추가되었습니다.</span>`;
      } else {
        addStatus.innerHTML = "<span class='text-warning'>이미 등록된 배번호입니다.</span>";
      }
    } catch (err) {
      console.error("선수 등록 에러:", err);
      addStatus.innerHTML = "<span class='text-danger'>선수 정보를 찾을 수 없습니다. 배번호를 다시 확인해주세요.</span>";
    }
  }

  async function loadRunners() {
    const storedRunners = JSON.parse(localStorage.getItem(groupKey) || "[]");
    const container = document.getElementById("runnerList");
    container.innerHTML = "";

    if (storedRunners.length === 0) {
      container.innerHTML = "<p>아직 등록된 선수가 없습니다.</p>";
      return;
    }

    const updatedRunners = [];

    for (const runner of storedRunners) {
      try {
        const latest = await fetchRunnerData(runner.bib);
        updatedRunners.push(latest);
      } catch (err) {
        console.error(`선수 ${runner.bib} 정보 업데이트 에러:`, err);
        updatedRunners.push(runner);
      }
    }

    localStorage.setItem(groupKey, JSON.stringify(updatedRunners));

    updatedRunners.forEach((runner, index) => {
      const div = document.createElement("div");
      div.className = "runner-box";

      const resultUrl = buildResultUrl(runner.bib);
      const lastCheckpoint = (runner.records || []).slice().reverse().find((r) => r.checkpointTime && r.checkpointTime !== "-");
      const title = runner.name ? escapeHtml(runner.name) : `배번 ${escapeHtml(runner.bib)}`;
      const waiting = !runner.linkOnly && !(runner.records || []).some((r) => r.checkpointTime && r.checkpointTime !== "-");
      const statusLine = runner.status === "pre-race" ? "⏳ 출발 전이에요. 대회가 시작되면 기록이 자동으로 들어와요."
        : waiting ? "⏳ 아직 통과 기록이 없어요." : "";

      div.innerHTML = `
        <button class="remove-btn" onclick="removeRunner(${index})">&times;</button>
        <a href="${resultUrl}" target="_blank" rel="noopener">
          <h5>▶️ ${title}${runner.category ? ` <small class="text-muted">${escapeHtml(runner.category)}</small>` : ""}</h5>
          <p class="runner-meta">🎽 배번호: ${escapeHtml(runner.bib)}</p>
          ${lastCheckpoint ? `<p class="runner-meta">📍 ${escapeHtml(lastCheckpoint.section)} | ⏱ ${escapeHtml(lastCheckpoint.checkpointTime)}</p>` : ""}
          ${runner.total ? `<p class="runner-meta">🏁 ${escapeHtml(runner.total)}${runner.rank ? ` · 코스 순위 ${escapeHtml(runner.rank)}` : ""}</p>` : ""}
          ${statusLine ? `<p class="runner-meta">${statusLine}</p>` : ""}
          ${runner.linkOnly ? `<p class="runner-meta">MyResult 공식 기록 페이지에서 실시간 기록을 확인하세요 ↗</p>` : ""}
        </a>
      `;
      container.appendChild(div);
    });
  }

  function removeRunner(index) {
    const runners = JSON.parse(localStorage.getItem(groupKey) || "[]");
    const runnerToRemove = runners[index];
    if (confirm(`${runnerToRemove.name || "배번 " + runnerToRemove.bib} (배번호 ${runnerToRemove.bib})를 삭제하시겠습니까?`)) {
      runners.splice(index, 1);
      localStorage.setItem(groupKey, JSON.stringify(runners));
      syncShareUrl();
      loadRunners();
    }
  }
</script>
</body>
</html>
